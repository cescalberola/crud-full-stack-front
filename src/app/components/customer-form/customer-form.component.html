<h2>{{ isEditMode ? 'Editar Cliente' : 'Crear Cliente' }}</h2>

<form (ngSubmit)="onSubmit()" #customerForm="ngForm">
  <div class="form-group">
    <label for="firstName">Nombre:</label>
    <input type="text" id="firstName" name="firstName" [(ngModel)]="customer.firstName" required />
  </div>

  <div class="form-group">
    <label for="lastName">Apellido:</label>
    <input type="text" id="lastName" name="lastName" [(ngModel)]="customer.lastName" required />
  </div>

  <div class="form-group">
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" [(ngModel)]="customer.email" required />
  </div>

  <button type="submit" [disabled]="customerForm.invalid">
    {{ isEditMode ? 'Actualizar' : 'Guardar' }}
  </button>
</form>

<br />
<a routerLink="/lista">← Volver a la lista</a>
